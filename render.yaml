services:
  - type: web
    name: senseiuc-portfolio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      # Free Render services have ephemeral filesystems. Upgrade to a disk or
      # managed database before relying on stored contact messages or leads.
      - key: DATABASE_PATH
        value: /tmp/senseiuc-portfolio.db
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITLAB_TOKEN
        sync: false
      - key: MAILTRAP_TOKEN
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: Senseiuc Portfolio
